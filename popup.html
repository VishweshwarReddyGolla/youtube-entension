<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      width: 220px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h3>YouTube Focus Mode</h3>

  <button id="toggleBtn">Loading...</button>

  <hr />

  <label>Study Hours (24h)</label>
  <input type="number" id="start" placeholder="Start (e.g. 9)" />
  <input type="number" id="end" placeholder="End (e.g. 18)" />

  <button id="saveTime">Save Time</button>

  <script src="popup.js"></script>
</body>
</html>
